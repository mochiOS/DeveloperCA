name = "mochios-developer-ca"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-26"

[build]
command = "worker-build --release --no-panic-recovery"

[vars]
ACCOUNTS_BASE_URL = "https://accounts.mochios.org"
CERTIFICATE_TTL_SECONDS = "31536000"

[triggers]
crons = ["*/15 * * * *"]

[[routes]]
pattern = "ca.mochios.org"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "mochios-developer-ca"
database_id = "4cea84e3-6120-4a62-983a-8af796a899ea"
migrations_dir = "migrations"

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 300, period = 60 }

[[services]]
binding = "ADMIN_DASHBOARD"
service = "mochios-admin-dashboard"

[[secrets_store_secrets]]
binding = "CONSOLE_SERVICE_TOKEN"
store_id = "bf2cdab48681486ebdb4f4e86db72530"
secret_name = "CONSOLE_SERVICE_TOKEN"

[[secrets_store_secrets]]
binding = "ADMIN_SERVICE_TOKEN"
store_id = "bf2cdab48681486ebdb4f4e86db72530"
secret_name = "ADMIN_SERVICE_TOKEN"

[[secrets_store_secrets]]
binding = "ADMIN_NOTIFICATION_SERVICE_TOKEN"
store_id = "bf2cdab48681486ebdb4f4e86db72530"
secret_name = "ADMIN_NOTIFICATION_SERVICE_TOKEN"
