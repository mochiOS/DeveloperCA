[package]
name = "developer-ca-root"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.3"
mochios-developer-ca-trust = { path = "../../crates/trust" }
mochios-developer-ca-auth-token = { path = "../../crates/auth-token" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
